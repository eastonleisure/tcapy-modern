# Test stack: run with
#   docker compose -p tcapy-test -f docker-compose.test.yml up --build --exit-code-from sut
# No ports are published to the host, so it can run alongside the main tcapy stack.
services:
  sut:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    volumes:
      - ./tcapy:/tcapy/tcapy:ro
      - ./tcapygen:/tcapy/tcapygen:ro
      - ./artifacts:/tcapy/artifacts
      - ./source:/source:ro
    env_file: .tcapy.env
    environment:
      - APP_ENV=docker
    depends_on:
      celery:
        condition: service_started
      redis:
        condition: service_healthy
      memcached:
        condition: service_started
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /tcapy
    command: "celery -A tcapy.conf.celery_calls worker --purge --discard --loglevel=debug -Q celery --concurrency=14 -f test_celery.log"
    env_file: .tcapy.env
    environment:
      - APP_ENV=docker
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      memcached:
        condition: service_started
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy

  redis:
    image: "redis:7.4-alpine"
    command: redis-server --port 6379 --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  memcached:
    image: memcached:1.6

  mongo:
    image: mongo:4.4
    env_file: .tcapy.env
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  mysql:
    image: mysql:8.0
    env_file: .tcapy.env
    environment:
      - MYSQL_DATABASE=trade_database_test_harness
    healthcheck:
      # Only healthy once the real server (not the init-time temporary one) accepts TCP connections
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      retries: 60

