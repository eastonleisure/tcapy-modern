# Test stack: run with
#   docker compose -p tcapy-test -f docker-compose.test.yml up --build --exit-code-from sut
# No ports are published to the host, so it can run alongside the main tcapy stack.
services:
  sut:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    volumes:
      - ./tcapy:/tcapy/tcapy:ro
      - ./tcapygen:/tcapy/tcapygen:ro
      - ./artifacts:/tcapy/artifacts
      - ./source:/source:ro
    env_file: .tcapy.env
    environment:
      - APP_ENV=docker
    depends_on:
      - celery
      - redis
      - memcached
      - mongo
      - mysql

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /tcapy
    command: "celery -A tcapy.conf.celery_calls worker --purge --discard --loglevel=debug -Q celery --concurrency=14 -f test_celery.log"
    env_file: .tcapy.env
    environment:
      - APP_ENV=docker
      - C_FORCE_ROOT=true
    depends_on:
      - redis
      - mongo
      - mysql
      - memcached

  redis:
    image: "redis:7.4-alpine"
    command: redis-server --port 6379 --save ""

  memcached:
    image: memcached:1.6

  mongo:
    image: mongo:4.4
    env_file: .tcapy.env

  mysql:
    image: mysql:8.0
    env_file: .tcapy.env
    environment:
      - MYSQL_DATABASE=trade_database_test_harness
