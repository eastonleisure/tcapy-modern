# Ports are published on 127.0.0.1 only, so only this computer can reach them: Redis, memcached and the web apps
# have no authentication. To expose a service to other machines deliberately, change its "127.0.0.1:" to
# "0.0.0.0:".
services:

  nginx:
    image: nginx:1.27
    container_name: nginx
    ports:
      - 127.0.0.1:9500:9500
    volumes:
      - ./tcapy:/tcapy
      - ./tcapy/conf/tcapy_nginx_gunicorn_docker.conf:/etc/nginx/conf.d/default.conf
      - ./log:/var/log/nginx
    depends_on:
      - gunicorn_tcapy
      - gunicorn_tcapyboard

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyter
    environment:
      - APP_ENV=docker
    env_file: .tcapy.env
    ports:
      - 127.0.0.1:8888:8888
    depends_on:
      - redis
      - celery
      - mongo
      - mysql
      - memcached
    volumes:
      - /tmp/csv:/tmp/csv
      - /tmp/tcapy:/tmp/tcapy
      - /data/csv_dump:/data/csv_dump
      - ./tcapy_notebooks:/home/jovyan/tcapy_notebooks
      - ./tcapy_scripts:/home/jovyan/tcapy_scripts
      # the notebooks read ../test/resources/ (populating_databases also writes dump files there)
      # and ../tcapy/vis/report/templates/
      - ./test:/home/jovyan/test
      - ./tcapy:/home/jovyan/tcapy:ro

  gunicorn_tcapy:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: "gunicorn --bind 0.0.0.0:8090 --workers 4 --threads 6 --preload --chdir /tcapy/tcapy/conf \
        --access-logfile /tcapy/log/gunicorn_tcapy_access.log \
        --error-logfile /tcapy/log/gunicorn_tcapy_error.log tcapy_wsgi:application"
    volumes:
      - ./log:/tcapy/log
      - /tmp/csv:/tmp/csv
      - /tmp/tcapy:/tmp/tcapy
      - /data/csv_dump:/data/csv_dump
    env_file: .tcapy.env
    environment:
      - APP_ENV=docker
      - TCAPY_CUEMACRO=/tcapy
    depends_on:
      - redis
      - mongo
      - mysql
      - memcached
      - celery
    ports:
      - 127.0.0.1:8090:8090

  gunicorn_tcapyboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: "gunicorn --bind 0.0.0.0:8092 --workers 4 --threads 6 --preload --chdir /tcapy/tcapy/conf \
        --access-logfile /tcapy/log/gunicorn_tcapyboard_access.log \
        --error-logfile /tcapy/log/gunicorn_tcapyboard_error.log tcapyboard_wsgi:application"
    volumes:
      - ./log:/tcapy/log
      - /tmp/csv:/tmp/csv
      - /tmp/tcapy:/tmp/tcapy
      - /data/csv_dump:/data/csv_dump
    env_file: .tcapy.env
    environment:
      - APP_ENV=docker
      - TCAPY_CUEMACRO=/tcapy
    depends_on:
      - redis
      - mongo
      - mysql
      - memcached
      - celery
    ports:
      - 127.0.0.1:8092:8092

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    working_dir: /tcapy
    command: "celery -A tcapy.conf.celery_calls worker --purge --discard --loglevel=debug -Q celery --concurrency=14 -f log/celery.log"
    volumes:
      - ./log:/tcapy/log
      - /tmp/csv:/tmp/csv
      - /tmp/tcapy:/tmp/tcapy
      - /data/csv_dump:/data/csv_dump
    env_file: .tcapy.env
    environment:
      - APP_ENV=docker
      - C_FORCE_ROOT=true
    depends_on:
      - redis
      - mongo
      - mysql
      - memcached

  redis:
    image: "redis:7.4-alpine"
    command: redis-server --port 6379 --save ""
    ports:
      - 127.0.0.1:6379:6379

  memcached:
    image: memcached:1.6
    ports:
      - 127.0.0.1:11211:11211

  mongo:
    image: mongo:4.4
    env_file: .tcapy.env
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - /data/db_mongodb:/data/db
      - ./log:/var/log/mongodb

  # MySQL 8.0's default caching_sha2_password authentication; mysql-connector-python 8.0.23 supports it
  mysql:
    image: mysql:8.0
    volumes:
      - /data/db_mysql:/var/lib/mysql
      # first-time setup: also give MYSQL_USER the trade_database_test_harness database the notebooks use
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    env_file: .tcapy.env
    ports:
      - 127.0.0.1:3306:3306

  adminer:
    image: adminer:4
    ports:
      - 127.0.0.1:8080:8080