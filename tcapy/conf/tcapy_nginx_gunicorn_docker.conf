server {
    listen 9500;

    # Resolve the gunicorn containers through Docker's embedded DNS at request time (rather than once at startup),
    # so nginx keeps working when those containers are recreated and get new IP addresses
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tcapy_upstream gunicorn_tcapy;
    set $tcapyboard_upstream gunicorn_tcapyboard;

    #location / {
    #    return 410;  # Default root of site won't exist.
    #}

    # With a variable in proxy_pass, nginx forwards the (rewritten) request URI as-is, so no URI part is given here
    location /tcapy/ {
        rewrite ^/tcapy(.*)$ $1 break;
        proxy_set_header Host gunicorn_tcapy;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$tcapy_upstream:8090;
    }

    location /tcapyboard/ {
        rewrite ^/tcapyboard(.*)$ $1 break;
        proxy_set_header Host gunicorn_tcapyboard;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$tcapyboard_upstream:8092;
    }
}